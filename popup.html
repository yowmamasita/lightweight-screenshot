<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="menu" role="menu">
    <button id="fullBtn" class="item" type="button" data-mode="full" role="menuitem">
      <span class="icon" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="1.75" width="10" height="12.5" rx="1.5"/>
          <line x1="5.5" y1="5" x2="10.5" y2="5"/>
          <line x1="5.5" y1="8" x2="10.5" y2="8"/>
          <line x1="5.5" y1="11" x2="8.5" y2="11"/>
        </svg>
      </span>
      <span class="label">
        <strong>Full Page</strong>
        <small>Scroll &amp; stitch entire page</small>
      </span>
    </button>

    <button id="visibleBtn" class="item" type="button" data-mode="visible" role="menuitem">
      <span class="icon" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 2.5H2.5V5M11 2.5h2.5V5M5 13.5H2.5V11M11 13.5h2.5V11"/>
          <rect x="4.5" y="5" width="7" height="6" rx="1"/>
        </svg>
      </span>
      <span class="label">
        <strong>What You See</strong>
        <small>Current visible viewport</small>
      </span>
    </button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
